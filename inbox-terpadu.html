<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ruang Pesan — inbox semua akun</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --rail:#1B1F26;
  --rail-2:#262C35;
  --ink:#14171C;
  --ink-2:#5A6069;
  --ink-3:#8A9098;
  --paper:#FFFFFF;
  --canvas:#EFEFEC;
  --line:#DFDED8;
  --accent:#8C2F39;
  --accent-soft:#F6E9EA;
  --ok:#1D7A5F;
  --radius:10px;
  --wa:#22A45D; --wab:#0F6B52; --ig:#C9317E; --fb:#1B5FC1; --tt:#111418; --tg:#1E88C7;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  font-family:"IBM Plex Sans",system-ui,sans-serif;
  background:var(--canvas);
  color:var(--ink);
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:74px 340px 1fr;height:100dvh;overflow:hidden}

/* ---------- rail akun ---------- */
.rail{background:var(--rail);display:flex;flex-direction:column;align-items:center;gap:14px;padding:14px 0;overflow-y:auto}
.rail::-webkit-scrollbar{width:0}
.brand{width:42px;height:42px;border-radius:12px;background:var(--accent);color:#fff;display:grid;place-items:center;font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:19px;flex:none}
.rail-sep{width:26px;height:1px;background:#3A424E;flex:none}
.acct{position:relative;flex:none}
.acct-btn{width:44px;height:44px;border-radius:14px;background:var(--rail-2);color:#C9CFD8;display:grid;place-items:center;font-weight:600;font-size:13px;letter-spacing:.2px;transition:background .15s,color .15s}
.acct-btn:hover{background:#333B47;color:#fff}
.acct.on .acct-btn{background:#fff;color:var(--ink)}
.acct.on::before{content:"";position:absolute;left:-14px;top:9px;width:4px;height:26px;border-radius:0 4px 4px 0;background:#fff}
.chdot{position:absolute;right:-2px;bottom:-2px;width:15px;height:15px;border-radius:5px;border:2px solid var(--rail);display:block}
.badge{position:absolute;top:-5px;right:-6px;min-width:19px;height:19px;padding:0 5px;border-radius:10px;background:var(--accent);color:#fff;font-size:11px;font-weight:600;display:grid;place-items:center;border:2px solid var(--rail)}
.rail-add{width:44px;height:44px;border-radius:14px;border:1px dashed #4A5361;color:#98A1AD;font-size:20px;line-height:1;display:grid;place-items:center;flex:none}
.rail-add:hover{border-color:#8A94A2;color:#fff}
.rail-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px;align-items:center}
.rail-me{width:34px;height:34px;border-radius:50%;background:#4A5361;color:#fff;display:grid;place-items:center;font-size:12px;font-weight:600}

/* ---------- kolom daftar ---------- */
.list{background:var(--paper);border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0}
.list-top{padding:16px 16px 10px}
.list-title{font-family:"Bricolage Grotesque",sans-serif;font-size:21px;font-weight:700;letter-spacing:-.02em;margin:0 0 2px}
.list-sub{color:var(--ink-2);font-size:12.5px;margin:0 0 12px}
.search{display:flex;align-items:center;gap:8px;background:var(--canvas);border:1px solid var(--line);border-radius:8px;padding:7px 10px}
.search input{border:0;background:none;width:100%;outline:none;font-size:13.5px}
.search svg{flex:none;color:var(--ink-3)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:12px 16px;border-bottom:1px solid var(--line);scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:5px 11px;border-radius:999px;border:1px solid var(--line);background:var(--paper);font-size:12.5px;color:var(--ink-2);display:flex;align-items:center;gap:6px;transition:.15s}
.chip:hover{border-color:#BDBBB2}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.chip i{width:8px;height:8px;border-radius:3px;display:block}
.threads{flex:1;overflow-y:auto}
.row{display:flex;gap:11px;padding:13px 16px;border-bottom:1px solid #F0EFEA;width:100%;text-align:left;align-items:flex-start;position:relative}
.row:hover{background:#FAFAF8}
.row.on{background:var(--accent-soft)}
.row.on::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent)}
.av{width:40px;height:40px;border-radius:13px;flex:none;display:grid;place-items:center;font-weight:600;font-size:13px;color:#fff;position:relative}
.av .chdot{border-color:var(--paper);right:-3px;bottom:-3px}
.row.on .av .chdot{border-color:var(--accent-soft)}
.row-mid{min-width:0;flex:1}
.row-name{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.row-name b{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-time{font-size:11.5px;color:var(--ink-3);flex:none}
.row-prev{color:var(--ink-2);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.row.unread .row-prev{color:var(--ink);font-weight:500}
.row-meta{display:flex;align-items:center;gap:6px;margin-top:6px;flex-wrap:wrap}
.tag{font-size:11px;padding:2px 7px;border-radius:5px;background:var(--canvas);color:var(--ink-2);border:1px solid var(--line)}
.tag.hot{background:#FDF1E7;border-color:#F0D6BE;color:#9A5518}
.acct-note{font-size:11.5px;color:var(--ink-3)}
.pill{margin-left:auto;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--accent);color:#fff;font-size:11px;font-weight:600;display:grid;place-items:center}
.empty{padding:44px 24px;text-align:center;color:var(--ink-2)}
.empty b{display:block;font-size:15px;color:var(--ink);margin-bottom:4px}

/* ---------- kolom percakapan ---------- */
.thread{display:flex;flex-direction:column;min-width:0;background:var(--canvas)}
.th-top{background:var(--paper);border-bottom:1px solid var(--line);padding:12px 18px;display:flex;align-items:center;gap:12px}
.back{display:none;width:32px;height:32px;border-radius:8px;place-items:center;border:1px solid var(--line)}
.th-id{min-width:0}
.th-id h2{margin:0;font-size:15.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.th-id p{margin:1px 0 0;font-size:12px;color:var(--ink-2);display:flex;align-items:center;gap:6px}
.th-actions{margin-left:auto;display:flex;gap:8px}
.btn{padding:7px 13px;border-radius:8px;border:1px solid var(--line);background:var(--paper);font-size:13px;font-weight:500;transition:.15s}
.btn:hover{border-color:#B9B7AE;background:#FBFBF9}
.btn-dark{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn-dark:hover{background:#000;border-color:#000}
.msgs{flex:1;overflow-y:auto;padding:22px 18px;display:flex;flex-direction:column;gap:10px}
.daysep{align-self:center;font-size:11.5px;color:var(--ink-2);background:#E4E4E0;padding:3px 12px;border-radius:999px;margin:6px 0}
.bub{max-width:min(72%,560px);padding:9px 13px;border-radius:14px;background:var(--paper);border:1px solid var(--line);align-self:flex-start;border-bottom-left-radius:4px;white-space:pre-wrap;word-break:break-word}
.bub.me{align-self:flex-end;background:var(--ink);color:#fff;border-color:var(--ink);border-bottom-left-radius:14px;border-bottom-right-radius:4px}
.bub time{display:block;font-size:11px;color:var(--ink-3);margin-top:4px}
.bub.me time{color:#9BA2AC}
.compose{background:var(--paper);border-top:1px solid var(--line);padding:12px 18px}
.quick{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:9px}
.quick button{font-size:12.5px;padding:5px 10px;border-radius:999px;border:1px solid var(--line);color:var(--ink-2)}
.quick button:hover{border-color:var(--ink);color:var(--ink)}
.cbox{display:flex;gap:10px;align-items:flex-end;border:1px solid var(--line);border-radius:12px;padding:8px 8px 8px 12px}
.cbox:focus-within{border-color:var(--ink)}
.cbox textarea{flex:1;border:0;outline:none;resize:none;max-height:130px;font-size:14px;line-height:1.45;background:none}
.send{width:38px;height:38px;border-radius:10px;background:var(--ink);color:#fff;display:grid;place-items:center;flex:none}
.send:disabled{opacity:.35;cursor:not-allowed}
.sendas{font-size:11.5px;color:var(--ink-3);margin:7px 2px 0}

/* ---------- panel akun ---------- */
.sheet{position:fixed;inset:0;background:rgba(20,23,28,.5);display:none;place-items:center;padding:20px;z-index:40}
.sheet.on{display:grid}
.card{background:var(--paper);border-radius:16px;width:min(560px,100%);max-height:88dvh;overflow-y:auto;padding:24px}
.card h3{font-family:"Bricolage Grotesque",sans-serif;font-size:22px;font-weight:700;margin:0 0 4px;letter-spacing:-.02em}
.card p.lede{margin:0 0 18px;color:var(--ink-2);font-size:13.5px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.pick{display:flex;gap:11px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:11px;text-align:left;transition:.15s}
.pick:hover{border-color:var(--ink)}
.pick.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.pick span{display:block;font-weight:600;font-size:13.5px}
.pick small{color:var(--ink-2);font-size:11.5px}
.qr{margin-top:18px;border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;gap:18px;align-items:center}
.qr-box{width:132px;height:132px;flex:none;border-radius:8px;background:
  repeating-conic-gradient(var(--ink) 0 25%, #fff 0 50%) 0 0/16px 16px;
  border:6px solid #fff;box-shadow:0 0 0 1px var(--line)}
.qr ol{margin:0;padding-left:17px;font-size:13px;color:var(--ink-2);line-height:1.8}
.mono{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--ink-2)}
.card-actions{display:flex;gap:9px;justify-content:flex-end;margin-top:20px}
.acct-line{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid #F0EFEA}
.acct-line:last-of-type{border-bottom:0}
.dot-ok{width:7px;height:7px;border-radius:50%;background:var(--ok);flex:none}
.dot-off{width:7px;height:7px;border-radius:50%;background:#C4C2BA;flex:none}
.status{margin-left:auto;font-size:12px;color:var(--ink-2);display:flex;align-items:center;gap:6px}
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:11px 18px;border-radius:10px;font-size:13.5px;opacity:0;pointer-events:none;transition:.25s;z-index:60}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* ---------- responsif ---------- */
@media (max-width:1000px){.app{grid-template-columns:64px 300px 1fr}}
@media (max-width:820px){
  .app{grid-template-columns:1fr;grid-template-rows:56px 1fr}
  .rail{flex-direction:row;padding:0 10px;gap:10px;overflow-x:auto;align-items:center}
  .rail-sep{width:1px;height:26px}
  .acct.on::before{left:9px;top:auto;bottom:-1px;width:26px;height:3px;border-radius:3px 3px 0 0}
  .brand,.acct-btn,.rail-add{width:36px;height:36px;border-radius:11px;font-size:12px}
  .rail-foot{margin-top:0;margin-left:auto;flex-direction:row}
  .list{border-right:0}
  .thread{display:none}
  body.viewing .list{display:none}
  body.viewing .thread{display:flex}
  .back{display:grid}
  .bub{max-width:86%}
}
</style>
</head>
<body>

<div class="app">

  <!-- ===== rail akun ===== -->
  <nav class="rail" aria-label="Akun terhubung">
    <div class="brand" title="Ruang Pesan">R</div>
    <div class="rail-sep"></div>
    <div class="acct on" id="acct-all">
      <button class="acct-btn" data-acct="all" title="Semua akun">All</button>
      <span class="badge" id="badge-all">0</span>
    </div>
    <div class="rail-sep"></div>
    <div id="rail-accounts" style="display:contents"></div>
    <button class="rail-add" id="btn-add" title="Tambah akun" aria-label="Tambah akun">+</button>
    <div class="rail-foot">
      <button class="rail-add" id="btn-manage" title="Kelola akun" aria-label="Kelola akun" style="border-style:solid">⚙</button>
      <div class="rail-me" title="Dina — admin">DA</div>
    </div>
  </nav>

  <!-- ===== daftar percakapan ===== -->
  <section class="list">
    <div class="list-top">
      <h1 class="list-title" id="scope-title">Semua pesan</h1>
      <p class="list-sub" id="scope-sub">6 akun terhubung</p>
      <label class="search">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input type="search" id="q" placeholder="Cari nama atau isi pesan" aria-label="Cari percakapan">
      </label>
    </div>
    <div class="chips" id="chips" role="group" aria-label="Saring channel"></div>
    <div class="threads" id="threads"></div>
  </section>

  <!-- ===== percakapan ===== -->
  <section class="thread" id="thread"></section>
</div>

<!-- ===== modal ===== -->
<div class="sheet" id="sheet" role="dialog" aria-modal="true"><div class="card" id="sheet-card"></div></div>
<div class="toast" id="toast"></div>

<script>
/* =========================================================
   Data contoh. Di versi asli, bagian ini diganti data dari
   server Anda (webhook + database), bukan ditulis di browser.
   ========================================================= */
const CH = {
  wa:  {label:"WhatsApp",          color:"var(--wa)",  short:"WA", note:"Nomor pribadi / API"},
  wab: {label:"WhatsApp Business", color:"var(--wab)", short:"WB", note:"Katalog & pesan otomatis"},
  ig:  {label:"Instagram",         color:"var(--ig)",  short:"IG", note:"DM & komentar"},
  fb:  {label:"Facebook",          color:"var(--fb)",  short:"FB", note:"Messenger halaman"},
  tt:  {label:"TikTok",            color:"var(--tt)",  short:"TT", note:"DM akun bisnis"},
  tg:  {label:"Telegram",          color:"var(--tg)",  short:"TG", note:"Bot & grup"}
};

let accounts = [
  {id:"a1", ch:"wa",  name:"CS Utama",        handle:"+62 812-1010-2020", status:"connected"},
  {id:"a2", ch:"wa",  name:"CS Cadangan",     handle:"+62 813-4455-6677", status:"connected"},
  {id:"a3", ch:"wab", name:"Toko Ranu Official", handle:"+62 811-9000-1234", status:"connected"},
  {id:"a4", ch:"ig",  name:"@ranu.store",     handle:"Instagram", status:"connected"},
  {id:"a5", ch:"fb",  name:"Ranu Store",      handle:"Halaman Facebook", status:"connected"},
  {id:"a6", ch:"tt",  name:"@ranustore",      handle:"TikTok Bisnis", status:"syncing"}
];

const AV = ["#3C6E71","#7A4E8C","#B4632A","#2E5E9E","#8C2F39","#4A6B2A","#1F6F6B","#6B4226"];
let seed = 0;
function pickAv(){ return AV[(seed++) % AV.length]; }

let convos = [
  {id:"c1", acct:"a1", name:"Rizky Ramadhan", tags:["Belum dibalas"], unread:2, time:"10:24", msgs:[
    {me:0,t:"Halo kak, kemarin saya order 2 pcs tapi yang datang cuma 1",at:"10:22"},
    {me:0,t:"Ini nomor resinya JX88213904",at:"10:24"}]},
  {id:"c2", acct:"a4", name:"nadia.putri", tags:["Prospek"], unread:1, time:"10:11", msgs:[
    {me:0,t:"kak yg warna sage masih ada ukuran L?",at:"10:11"}]},
  {id:"c3", acct:"a3", name:"Bu Wulan (Grosir)", tags:["Reseller"], unread:0, time:"09:58", msgs:[
    {me:0,t:"Pak, saya mau ambil 3 lusin lagi untuk minggu depan",at:"09:40"},
    {me:1,t:"Siap Bu Wulan. Untuk 3 lusin harganya 2.340.000 sudah termasuk ongkir Surabaya.",at:"09:52"},
    {me:0,t:"Oke saya transfer sore ini ya",at:"09:58"}]},
  {id:"c4", acct:"a6", name:"dimasfrz", tags:["Dari live"], unread:3, time:"09:44", msgs:[
    {me:0,t:"bang yg di live tadi harganya berapa",at:"09:41"},
    {me:0,t:"yg model kedua",at:"09:42"},
    {me:0,t:"halo?",at:"09:44"}]},
  {id:"c5", acct:"a5", name:"Andi Prasetyo", tags:[], unread:0, time:"09:20", msgs:[
    {me:0,t:"Apakah bisa COD ke Sidoarjo?",at:"09:12"},
    {me:1,t:"Bisa kak, COD tersedia untuk Sidoarjo dengan minimum belanja 150 ribu.",at:"09:20"}]},
  {id:"c6", acct:"a2", name:"Siti Halimah", tags:["Komplain"], unread:1, time:"08:47", msgs:[
    {me:0,t:"Paket saya statusnya masih di gudang dari 3 hari lalu",at:"08:47"}]},
  {id:"c7", acct:"a1", name:"Bagus Setiawan", tags:[], unread:0, time:"Kemarin", msgs:[
    {me:0,t:"Terima kasih kak barangnya sudah sampai",at:"16:30"},
    {me:1,t:"Sama-sama kak Bagus, ditunggu order berikutnya.",at:"16:35"}]},
  {id:"c8", acct:"a4", name:"kopi.senja.id", tags:["Kolaborasi"], unread:0, time:"Kemarin", msgs:[
    {me:0,t:"Halo, kami tertarik barter konten. Boleh minta kontak marketing?",at:"14:02"},
    {me:1,t:"Halo! Boleh, silakan email ke halo@ranustore.id ya.",at:"15:10"}]},
  {id:"c9", acct:"a3", name:"Pak Herman", tags:["Reseller"], unread:0, time:"Kemarin", msgs:[
    {me:0,t:"Stok yang varian hitam kapan restock?",at:"11:05"},
    {me:1,t:"Perkiraan Jumat depan masuk gudang Pak.",at:"11:20"}]},
  {id:"c10", acct:"a2", name:"Melati Anggraini", tags:["Prospek"], unread:0, time:"Sen", msgs:[
    {me:0,t:"Ada diskon untuk pembelian pertama?",at:"13:44"},
    {me:1,t:"Ada kak, pakai kode HALO10 untuk potongan 10%.",at:"13:50"}]}
];
convos.forEach(c=>c.color=pickAv());

const QUICK = ["Halo kak, ada yang bisa dibantu?","Stoknya masih tersedia ya kak.","Boleh minta nomor pesanannya?","Terima kasih, pesanan sedang diproses."];

/* ================= state ================= */
let scope = "all";      // "all" | id akun
let chFilter = "all";   // "all" | kode channel
let openId = null;
let query = "";

/* ================= util ================= */
const $ = s => document.querySelector(s);
const acctOf = id => accounts.find(a => a.id === id);
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const initials = n => n.replace(/[@._]/g," ").trim().split(/\s+/).slice(0,2).map(w=>w[0]).join("").toUpperCase();

function toast(msg){
  const t = $("#toast"); t.textContent = msg; t.classList.add("on");
  clearTimeout(t._x); t._x = setTimeout(()=>t.classList.remove("on"), 2400);
}

function visibleConvos(){
  return convos.filter(c=>{
    const a = acctOf(c.acct);
    if(!a) return false;
    if(scope !== "all" && c.acct !== scope) return false;
    if(chFilter !== "all" && a.ch !== chFilter) return false;
    if(query){
      const hay = (c.name + " " + c.msgs.map(m=>m.t).join(" ")).toLowerCase();
      if(!hay.includes(query)) return false;
    }
    return true;
  });
}

/* ================= render: rail ================= */
function renderRail(){
  const wrap = $("#rail-accounts");
  wrap.innerHTML = accounts.map(a=>{
    const n = convos.filter(c=>c.acct===a.id).reduce((s,c)=>s+c.unread,0);
    return `<div class="acct ${scope===a.id?"on":""}" data-acct="${a.id}">
      <button class="acct-btn" title="${esc(a.name)} — ${CH[a.ch].label}">${esc(initials(a.name))}</button>
      <span class="chdot" style="background:${CH[a.ch].color}"></span>
      ${n?`<span class="badge">${n}</span>`:""}
    </div>`;
  }).join("");
  const total = convos.reduce((s,c)=>s+c.unread,0);
  const bAll = $("#badge-all");
  bAll.textContent = total; bAll.style.display = total ? "grid" : "none";
  $("#acct-all").classList.toggle("on", scope==="all");
}

/* ================= render: chip channel ================= */
function renderChips(){
  const used = [...new Set(accounts.map(a=>a.ch))];
  const unreadAll = convos.reduce((s,c)=>s+c.unread,0);
  let html = `<button class="chip ${chFilter==="all"?"on":""}" data-ch="all">Semua ${unreadAll?`· ${unreadAll}`:""}</button>`;
  html += used.map(ch=>{
    const ids = accounts.filter(a=>a.ch===ch).map(a=>a.id);
    const n = convos.filter(c=>ids.includes(c.acct)).reduce((s,c)=>s+c.unread,0);
    return `<button class="chip ${chFilter===ch?"on":""}" data-ch="${ch}"><i style="background:${CH[ch].color}"></i>${CH[ch].label}${n?` · ${n}`:""}</button>`;
  }).join("");
  $("#chips").innerHTML = html;
}

/* ================= render: daftar ================= */
function renderList(){
  const list = visibleConvos();
  const box = $("#threads");
  if(!list.length){
    box.innerHTML = `<div class="empty"><b>Tidak ada percakapan di sini</b>Ubah saringan channel atau kata kunci pencarian.</div>`;
  } else {
    box.innerHTML = list.map(c=>{
      const a = acctOf(c.acct);
      const last = c.msgs[c.msgs.length-1];
      return `<button class="row ${c.id===openId?"on":""} ${c.unread?"unread":""}" data-id="${c.id}">
        <span class="av" style="background:${c.color}">${esc(initials(c.name))}<span class="chdot" style="background:${CH[a.ch].color}"></span></span>
        <span class="row-mid">
          <span class="row-name"><b>${esc(c.name)}</b><span class="row-time">${esc(c.time)}</span></span>
          <span class="row-prev">${last.me?"Anda: ":""}${esc(last.t)}</span>
          <span class="row-meta">
            <span class="acct-note">${esc(a.name)}</span>
            ${c.tags.map(t=>`<span class="tag ${t==="Komplain"?"hot":""}">${esc(t)}</span>`).join("")}
            ${c.unread?`<span class="pill">${c.unread}</span>`:""}
          </span>
        </span>
      </button>`;
    }).join("");
  }
  const title = scope==="all" ? "Semua pesan" : acctOf(scope).name;
  $("#scope-title").textContent = title;
  const unread = list.reduce((s,c)=>s+c.unread,0);
  $("#scope-sub").textContent = scope==="all"
    ? `${accounts.length} akun terhubung · ${unread} belum dibaca`
    : `${CH[acctOf(scope).ch].label} · ${acctOf(scope).handle} · ${unread} belum dibaca`;
}

/* ================= render: percakapan ================= */
function renderThread(){
  const th = $("#thread");
  const c = convos.find(x=>x.id===openId);
  if(!c){
    th.innerHTML = `<div class="empty" style="margin:auto"><b>Pilih satu percakapan</b>Pesan dari semua akun WhatsApp, Instagram, Facebook, dan TikTok masuk ke daftar di sebelah kiri.</div>`;
    return;
  }
  const a = acctOf(c.acct);
  th.innerHTML = `
    <header class="th-top">
      <button class="back" id="back" aria-label="Kembali ke daftar">←</button>
      <span class="av" style="background:${c.color}">${esc(initials(c.name))}<span class="chdot" style="background:${CH[a.ch].color}"></span></span>
      <span class="th-id">
        <h2>${esc(c.name)}</h2>
        <p><i style="width:7px;height:7px;border-radius:50%;background:${CH[a.ch].color};display:inline-block"></i> ${CH[a.ch].label} · masuk lewat ${esc(a.name)}</p>
      </span>
      <span class="th-actions">
        <button class="btn" data-act="tag">Beri label</button>
        <button class="btn" data-act="done">Tandai selesai</button>
      </span>
    </header>
    <div class="msgs" id="msgs">
      <span class="daysep">${esc(c.time==="Kemarin"||c.time==="Sen"?c.time:"Hari ini")}</span>
      ${c.msgs.map(m=>`<div class="bub ${m.me?"me":""}">${esc(m.t)}<time>${esc(m.at)}</time></div>`).join("")}
    </div>
    <div class="compose">
      <div class="quick">${QUICK.map(q=>`<button data-q="${esc(q)}">${esc(q)}</button>`).join("")}</div>
      <div class="cbox">
        <textarea id="input" rows="1" placeholder="Tulis balasan…" aria-label="Tulis balasan"></textarea>
        <button class="send" id="send" disabled aria-label="Kirim balasan">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l16-8-6 16-2.5-6.5L4 12z"/></svg>
        </button>
      </div>
      <p class="sendas">Balasan dikirim dari ${esc(a.name)} (${esc(a.handle)})</p>
    </div>`;
  const box = $("#msgs"); box.scrollTop = box.scrollHeight;

  const input = $("#input"), send = $("#send");
  input.focus();
  input.addEventListener("input", ()=>{
    send.disabled = !input.value.trim();
    input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight,130) + "px";
  });
  input.addEventListener("keydown", e=>{
    if(e.key==="Enter" && !e.shiftKey){ e.preventDefault(); doSend(); }
  });
  send.addEventListener("click", doSend);
  th.querySelectorAll("[data-q]").forEach(b=>b.addEventListener("click",()=>{
    input.value = b.dataset.q; input.dispatchEvent(new Event("input")); input.focus();
  }));
  $("#back").addEventListener("click", ()=>{ document.body.classList.remove("viewing"); openId=null; renderList(); renderThread(); });
  th.querySelector('[data-act="done"]').addEventListener("click", ()=>{
    c.tags = c.tags.filter(t=>t!=="Belum dibalas"); toast("Percakapan ditandai selesai"); renderList();
  });
  th.querySelector('[data-act="tag"]').addEventListener("click", ()=>{
    if(!c.tags.includes("Penting")) c.tags.push("Penting");
    toast("Label ditambahkan: Penting"); renderList();
  });

  function doSend(){
    const v = input.value.trim(); if(!v) return;
    const now = new Date();
    c.msgs.push({me:1,t:v,at:String(now.getHours()).padStart(2,"0")+":"+String(now.getMinutes()).padStart(2,"0")});
    c.time = "Baru saja";
    c.tags = c.tags.filter(t=>t!=="Belum dibalas");
    renderThread(); renderList(); renderRail();
  }
}

function openConvo(id){
  openId = id;
  const c = convos.find(x=>x.id===id);
  if(c) c.unread = 0;
  document.body.classList.add("viewing");
  renderList(); renderThread(); renderRail(); renderChips();
}

/* ================= modal: tambah / kelola akun ================= */
let newCh = null;
function openAdd(){
  newCh = null;
  $("#sheet-card").innerHTML = `
    <h3>Tambah akun</h3>
    <p class="lede">Pilih layanan yang mau dihubungkan. Satu bisnis boleh punya banyak nomor WhatsApp sekaligus.</p>
    <div class="grid">${Object.entries(CH).map(([k,v])=>`
      <button class="pick" data-ch="${k}">
        <span class="av" style="background:${v.color};width:34px;height:34px;border-radius:10px;font-size:12px">${v.short}</span>
        <span><span>${v.label}</span><small>${v.note}</small></span>
      </button>`).join("")}</div>
    <div id="step2"></div>
    <div class="card-actions">
      <button class="btn" data-close>Batal</button>
      <button class="btn btn-dark" id="connect" disabled>Hubungkan</button>
    </div>`;
  $("#sheet").classList.add("on");
  $("#sheet-card").querySelectorAll(".pick").forEach(b=>b.addEventListener("click",()=>{
    $("#sheet-card").querySelectorAll(".pick").forEach(x=>x.classList.remove("on"));
    b.classList.add("on"); newCh = b.dataset.ch; $("#connect").disabled = false;
    $("#step2").innerHTML = (newCh==="wa"||newCh==="wab") ? `
      <div class="qr">
        <div class="qr-box" role="img" aria-label="Kode QR contoh"></div>
        <ol>
          <li>Buka WhatsApp di HP yang mau ditambahkan</li>
          <li>Masuk ke Perangkat tertaut, lalu Tautkan perangkat</li>
          <li>Arahkan kamera ke kode di samping</li>
        </ol>
      </div>
      <p class="mono" style="margin:10px 2px 0">sesi: wa_${Math.random().toString(36).slice(2,10)} · kode berlaku 45 detik</p>`
    : `<div class="qr"><ol style="padding-left:17px">
        <li>Anda akan diarahkan ke halaman izin ${CH[newCh].label}</li>
        <li>Pilih akun bisnis yang mau dipakai</li>
        <li>Setujui izin membaca dan membalas pesan</li>
      </ol></div>`;
  }));
  $("#connect").addEventListener("click", ()=>{
    const btn = $("#connect"); btn.disabled = true; btn.textContent = "Menghubungkan…";
    setTimeout(()=>{
      const n = accounts.filter(a=>a.ch===newCh).length + 1;
      accounts.push({id:"a"+(accounts.length+1), ch:newCh, name:`${CH[newCh].label} ${n}`, handle:newCh==="wa"||newCh==="wab"?"+62 8xx-xxxx-xxxx":CH[newCh].label, status:"connected"});
      closeSheet(); renderAll(); toast(`${CH[newCh].label} berhasil terhubung`);
    }, 1200);
  });
}

function openManage(){
  $("#sheet-card").innerHTML = `
    <h3>Akun terhubung</h3>
    <p class="lede">Pesan dari semua akun ini masuk ke satu kotak masuk.</p>
    ${accounts.map(a=>`
      <div class="acct-line">
        <span class="av" style="background:${CH[a.ch].color};width:34px;height:34px;border-radius:10px;font-size:12px">${CH[a.ch].short}</span>
        <span><span style="font-weight:600;display:block">${esc(a.name)}</span><small style="color:var(--ink-2);font-size:12px">${esc(a.handle)}</small></span>
        <span class="status"><i class="${a.status==="connected"?"dot-ok":"dot-off"}"></i>${a.status==="connected"?"Aktif":"Menyinkronkan"}
          <button class="btn" style="padding:4px 9px;font-size:12px" data-drop="${a.id}">Putuskan</button></span>
      </div>`).join("")}
    <div class="card-actions">
      <button class="btn" data-close>Tutup</button>
      <button class="btn btn-dark" id="more">Tambah akun</button>
    </div>`;
  $("#sheet").classList.add("on");
  $("#more").addEventListener("click", openAdd);
  $("#sheet-card").querySelectorAll("[data-drop]").forEach(b=>b.addEventListener("click",()=>{
    const id = b.dataset.drop;
    accounts = accounts.filter(a=>a.id!==id);
    convos = convos.filter(c=>c.acct!==id);
    if(scope===id) scope = "all";
    closeSheet(); renderAll(); toast("Akun diputuskan");
  }));
}
function closeSheet(){ $("#sheet").classList.remove("on"); }

/* ================= events ================= */
document.querySelector(".rail").addEventListener("click", e=>{
  const el = e.target.closest("[data-acct]"); if(!el) return;
  scope = el.dataset.acct === "all" ? "all" : el.parentElement.dataset.acct || el.dataset.acct;
  const holder = e.target.closest(".acct");
  if(holder) scope = holder.dataset.acct || (holder.id==="acct-all" ? "all" : scope);
  openId = null; document.body.classList.remove("viewing");
  renderAll();
});
$("#chips").addEventListener("click", e=>{
  const b = e.target.closest(".chip"); if(!b) return;
  chFilter = b.dataset.ch; renderChips(); renderList();
});
$("#threads").addEventListener("click", e=>{
  const r = e.target.closest(".row"); if(r) openConvo(r.dataset.id);
});
$("#q").addEventListener("input", e=>{ query = e.target.value.trim().toLowerCase(); renderList(); });
$("#btn-add").addEventListener("click", openAdd);
$("#btn-manage").addEventListener("click", openManage);
$("#sheet").addEventListener("click", e=>{
  if(e.target.id==="sheet" || e.target.hasAttribute("data-close")) closeSheet();
});
document.addEventListener("keydown", e=>{
  if(e.key!=="Escape") return;
  if($("#sheet").classList.contains("on")) closeSheet();
  else if(document.body.classList.contains("viewing")) $("#back")?.click();
});

  {acct:"a4", name:"rara.olshop", t:"kak ini ready ga yg motif garis?"},
  {acct:"a1", name:"Yoga Pratama", t:"Sudah saya transfer ya, ini buktinya"},
  {acct:"a6", name:"febyy_", t:"link keranjang kuningnya mana kak"}
];
let inbox = 0;

  const now = new Date();
  const at = String(now.getHours()).padStart(2,"0")+":"+String(now.getMinutes()).padStart(2,"0");
  convos.unshift({id:"n"+inbox, acct:d.acct, name:d.name, tags:["Belum dibalas"], unread:1,
    time:"Baru saja", color:pickAv(), msgs:[{me:0,t:d.t,at}]});
  renderAll();
  toast(`Pesan baru dari ${d.name}`);
}, 18000);

/* ================= mulai ================= */
function renderAll(){ renderRail(); renderChips(); renderList(); renderThread(); }
renderAll();
</script>
