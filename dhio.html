<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dhio · Panel laporan KLINKLIN</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=Plus+Jakarta+Sans:wght@400;500;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#e9ecef; --surface:#fff; --surface-2:#f5f7f8;
  --ink:#111a1f; --ink-soft:#54646d; --ink-faint:#8a979e;
  --line:#d9dfe3; --line-soft:#e8ecee;
  --brand:#0a6a63; --brand-deep:#063e3a; --brand-tint:#e2f0ee;
  --signal:#d9531e; --signal-tint:#fdeadf;
  --ok:#2f7d4f; --ok-tint:#e4f1e9;
  --rail:#101b1f; --rail-2:#18272c; --rail-line:#243940; --rail-txt:#9fb4b9;
  --r:14px; --r-sm:9px;
  --shadow:0 1px 2px rgba(17,26,31,.06), 0 8px 24px -16px rgba(17,26,31,.35);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Plus Jakarta Sans",system-ui,sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:4px}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;letter-spacing:-.01em}

.shell{display:grid;grid-template-columns:330px 1fr;height:100%}

/* ---------- RAIL ---------- */
.rail{background:var(--rail);color:var(--rail-txt);display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--rail-line)}
.rail-top{padding:16px 16px 12px;border-bottom:1px solid var(--rail-line)}
.brand{display:flex;align-items:center;gap:10px;color:#fff;font-weight:800;letter-spacing:-.02em;font-size:17px}
.brand-dot{width:26px;height:26px;border-radius:8px;background:var(--signal);display:grid;place-items:center;color:#fff;font-size:13px;font-weight:800}
.who{margin-top:12px;display:flex;align-items:center;gap:9px;font-size:13px}
.who .ava{width:28px;height:28px;border-radius:9px;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:11.5px;font-weight:700}
.who b{color:#fff;font-weight:600}
.who span{color:#7a949a}
.search{margin-top:12px;position:relative}
.search input{width:100%;background:var(--rail-2);border:1px solid var(--rail-line);border-radius:var(--r-sm);padding:9px 11px 9px 32px;color:#fff;font-size:13.5px}
.search input::placeholder{color:#6a848a}
.search input:focus{outline:none;border-color:#3a6d68}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:#6a848a}
.tabs{display:flex;gap:4px;padding:10px 12px;border-bottom:1px solid var(--rail-line)}
.tab{padding:6px 11px;border-radius:100px;font-size:12.5px;font-weight:500;color:#8ea6ac}
.tab[aria-pressed="true"]{background:var(--rail-2);color:#fff}
.tab i{font-style:normal;color:var(--signal);font-weight:700}
.rooms{flex:1;overflow-y:auto;padding:8px}
.room{width:100%;text-align:left;padding:11px 12px;border-radius:11px;display:block;position:relative}
.room:hover{background:var(--rail-2)}
.room.on{background:var(--rail-2);box-shadow:inset 2px 0 0 var(--brand)}
.room .l1{display:flex;align-items:center;gap:8px}
.room .nm{color:#fff;font-weight:600;font-size:13.5px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.room .tm{font-size:11px;color:#6a848a;flex:none}
.room .jb{font-size:11.5px;color:#7a949a;margin:1px 0 4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.room .pv{font-size:12.5px;color:#93aab0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;gap:6px;align-items:center}
.room .pv em{font-style:normal;color:#5f797f}
.dot{width:7px;height:7px;border-radius:50%;background:var(--signal);flex:none}
.room .tags{display:flex;gap:5px;margin-top:6px}
.tag{font-size:10.5px;font-weight:600;padding:2px 7px;border-radius:100px;background:#20343a;color:#9fc0c4}
.tag.baru{background:#43220f;color:#f0a074}
.tag.diproses{background:#123c39;color:#6cc0b6}
.tag.selesai{background:#1b3325;color:#7fbb96}
.rail-empty{padding:26px 18px;font-size:13px;color:#6a848a}

/* ---------- PANEL ---------- */
.panel{display:flex;flex-direction:column;min-width:0;height:100%}
.blank{flex:1;display:grid;place-items:center;text-align:center;padding:30px}
.blank div{max-width:330px}
.blank h2{font-size:17px;margin:0 0 6px;letter-spacing:-.02em}
.blank p{margin:0;color:var(--ink-soft);font-size:13.5px}
.head{background:var(--surface);border-bottom:1px solid var(--line);padding:11px 18px;display:flex;align-items:center;gap:12px;flex:none}
.back{display:none}
.head .ava{width:36px;height:36px;border-radius:11px;background:var(--brand-tint);color:var(--brand-deep);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.head .t{min-width:0;flex:1}
.head .t b{display:block;font-size:14.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.head .t span{font-size:12.5px;color:var(--ink-soft)}
.kode{font-size:12px;color:var(--ink-soft);background:var(--surface-2);border:1px solid var(--line-soft);padding:4px 9px;border-radius:6px}
select.status{border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:var(--surface-2);font-size:13px;font-weight:600}
select.status.baru{background:var(--signal-tint);border-color:#f2c7ad;color:#a63c11}
select.status.diproses{background:var(--brand-tint);border-color:#b9dbd6;color:var(--brand-deep)}
select.status.selesai{background:var(--ok-tint);border-color:#bfdcca;color:#1f5c39}

.log{flex:1;overflow-y:auto;padding:22px 18px 8px}
.log-inner{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.ctx{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--signal);border-radius:var(--r);padding:13px 15px;font-size:13.5px;color:var(--ink-soft)}
.ctx b{color:var(--ink)}
.daysep{display:flex;align-items:center;gap:12px;color:var(--ink-faint);font-size:12px;margin:6px 0}
.daysep::before,.daysep::after{content:"";flex:1;height:1px;background:var(--line)}
.msg{display:flex;gap:10px;max-width:82%}
.msg.me{margin-left:auto;flex-direction:row-reverse}
.avatar{flex:none;width:32px;height:32px;border-radius:10px;display:grid;place-items:center;font-size:12px;font-weight:700;background:var(--surface);border:1px solid var(--line);color:var(--ink-soft);margin-top:16px}
.msg.me .avatar{background:var(--brand);color:#fff;border-color:var(--brand)}
.msg-main{min-width:0}
.msg-meta{display:flex;gap:8px;align-items:baseline;margin-bottom:4px;font-size:12px;color:var(--ink-faint)}
.msg.me .msg-meta{flex-direction:row-reverse}
.msg-meta b{font-size:12.5px;font-weight:600;color:var(--ink-soft)}
.bubble{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);border-top-left-radius:4px;padding:10px 13px;box-shadow:0 1px 1px rgba(17,26,31,.04)}
.msg.me .bubble{background:var(--brand);border-color:var(--brand);color:#fff;border-top-left-radius:var(--r);border-top-right-radius:4px}
.bubble .text{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14.5px}
.bubble.only-img{padding:5px}
.atts{display:grid;gap:5px;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));max-width:360px}
.atts.one{grid-template-columns:1fr;max-width:290px}
.atts+.text{margin-top:9px}
.att{display:block;width:100%;padding:0;border-radius:var(--r-sm);overflow:hidden;background:var(--surface-2);aspect-ratio:4/3}
.atts.one .att{aspect-ratio:auto;max-height:330px}
.att img{width:100%;height:100%;object-fit:cover;display:block}
.atts.one .att img{object-fit:contain;max-height:330px}
.msg.enter{animation:pop .22s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(6px)}}

.composer{flex:none;background:var(--surface);border-top:1px solid var(--line);padding:12px 18px calc(12px + env(safe-area-inset-bottom))}
.composer-inner{max-width:760px;margin:0 auto}
.quick{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:9px}
.quick button{font-size:12.5px;padding:5px 11px;border:1px solid var(--line);border-radius:100px;background:var(--surface-2);color:var(--ink-soft)}
.quick button:hover{border-color:var(--brand);color:var(--brand)}
.tray{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.tray:empty{display:none}
.thumb{position:relative;width:66px;height:66px;border-radius:var(--r-sm);overflow:hidden;border:1px solid var(--line)}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb .x{position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;background:rgba(17,26,31,.72);color:#fff;display:grid;place-items:center;font-size:13px;line-height:1}
.thumb .bar{position:absolute;inset:auto 0 0 0;height:3px;background:var(--brand);width:0;transition:width .2s}
.box{display:flex;align-items:flex-end;gap:8px;border:1px solid var(--line);border-radius:var(--r);padding:6px 6px 6px 10px;background:var(--surface-2)}
.box:focus-within{border-color:var(--brand);background:#fff;box-shadow:0 0 0 3px var(--brand-tint)}
.box.drop{border-color:var(--brand);border-style:dashed;background:var(--brand-tint)}
.box textarea{flex:1;border:0;background:none;resize:none;max-height:150px;padding:8px 0;font-size:14.5px}
.box textarea:focus{outline:none}
.icon-btn{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;color:var(--ink-soft)}
.icon-btn:hover{background:var(--line-soft);color:var(--ink)}
.send{width:38px;height:38px;border-radius:10px;background:var(--brand);color:#fff;display:grid;place-items:center;flex:none}
.send:disabled{background:var(--line);color:var(--ink-faint)}
.hint{font-size:11.5px;color:var(--ink-faint);margin:7px 2px 0}

.lb{position:fixed;inset:0;background:rgba(9,14,17,.93);z-index:100;display:none;flex-direction:column}
.lb.on{display:flex;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.lb-bar{display:flex;align-items:center;gap:12px;padding:14px 18px;color:#cfd8dc;font-size:13px}
.lb-bar .sp{margin-left:auto;display:flex;gap:6px}
.lb-bar a,.lb-bar button{color:#cfd8dc;padding:8px 12px;border-radius:8px;font-size:13px;text-decoration:none}
.lb-bar a:hover,.lb-bar button:hover{background:rgba(255,255,255,.12);color:#fff}
.lb-stage{flex:1;display:grid;place-items:center;padding:0 14px 22px;min-height:0}
.lb-stage img{max-width:100%;max-height:100%;object-fit:contain;border-radius:6px}
.lb-nav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.12);color:#fff;display:grid;place-items:center}
.lb-nav:hover{background:rgba(255,255,255,.24)}
.lb-nav.prev{left:14px}.lb-nav.next{right:14px}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:100px;font-size:13.5px;z-index:200;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(max-width:860px){
  .shell{grid-template-columns:1fr}
  .rail{position:absolute;inset:0;z-index:20}
  .panel{position:absolute;inset:0;z-index:10;background:var(--paper);transform:translateX(100%);transition:transform .2s}
  .shell.open .panel{transform:none;z-index:30}
  .back{display:grid}
  .log{padding:16px 12px 4px}
  .composer{padding:10px 12px calc(10px + env(safe-area-inset-bottom))}
  .msg{max-width:92%}
}
</style>
</head>
<body>
<div class="shell" id="shell">

  <!-- ══ DAFTAR TIKET ══ -->
  <aside class="rail">
    <div class="rail-top">
      <div class="brand"><span class="brand-dot">K</span> KLINKLIN</div>
      <div class="who">
        <span class="ava">D</span>
        <div><b>Dhio</b> <span>· membalas sebagai tim</span></div>
      </div>
      <div class="search">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="q" placeholder="Cari nama, jabatan, kode tiket">
      </div>
    </div>
    <div class="tabs" id="tabs">
      <button class="tab" data-f="semua" aria-pressed="true">Semua</button>
      <button class="tab" data-f="baru" aria-pressed="false">Baru <i id="cBaru"></i></button>
      <button class="tab" data-f="diproses" aria-pressed="false">Diproses</button>
      <button class="tab" data-f="selesai" aria-pressed="false">Selesai</button>
    </div>
    <div class="rooms" id="rooms"></div>
  </aside>

  <!-- ══ PERCAKAPAN ══ -->
  <section class="panel" id="panel">
    <div class="blank" id="blank">
      <div>
        <h2>Belum ada percakapan terbuka</h2>
        <p>Pilih satu laporan di sebelah kiri untuk membaca keluhannya dan membalas.</p>
      </div>
    </div>

    <div id="chat" style="display:none;flex-direction:column;height:100%">
      <header class="head">
        <button class="icon-btn back" id="back" aria-label="Kembali ke daftar">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 19l-7-7 7-7"/></svg>
        </button>
        <span class="ava" id="hAva"></span>
        <div class="t"><b id="hNama"></b><span id="hJab"></span></div>
        <span class="kode mono" id="hKode"></span>
        <select class="status" id="hStatus">
          <option value="baru">Baru</option>
          <option value="diproses">Diproses</option>
          <option value="selesai">Selesai</option>
        </select>
      </header>

      <div class="log" id="log"><div class="log-inner" id="logInner"></div></div>

      <div class="composer">
        <div class="composer-inner">
          <div class="quick" id="quick">
            <button>Terima kasih laporannya, saya cek dulu ya.</button>
            <button>Boleh kirim tangkapan layar halamannya?</button>
            <button>Sudah diperbaiki, mohon dicoba lagi.</button>
          </div>
          <div class="tray" id="tray"></div>
          <div class="box" id="box">
            <textarea id="input" rows="1" placeholder="Balas sebagai Dhio…"></textarea>
            <button class="icon-btn" id="clipBtn" aria-label="Lampirkan gambar">
              <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M21 11.5l-8.4 8.4a5 5 0 01-7-7l8.4-8.4a3.3 3.3 0 014.7 4.7l-8.4 8.4a1.7 1.7 0 01-2.3-2.3l7.8-7.8"/></svg>
            </button>
            <button class="send" id="sendBtn" aria-label="Kirim balasan" disabled>
              <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M3.2 20.4l18-8.4-18-8.4L3.2 10l12 2-12 2z"/></svg>
            </button>
          </div>
          <div class="hint">Enter kirim · Shift+Enter baris baru · tempel tangkapan layar dengan Ctrl+V</div>
        </div>
      </div>
    </div>
  </section>
</div>

<input type="file" id="file" accept="image/*" multiple hidden>

<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="Pratinjau gambar">
  <div class="lb-bar">
    <span id="lbCap"></span>
    <span class="sp">
      <a id="lbDl" download target="_blank" rel="noopener">Unduh</a>
      <button id="lbClose">Tutup</button>
    </span>
  </div>
  <div class="lb-stage">
    <button class="lb-nav prev" id="lbPrev" aria-label="Gambar sebelumnya">‹</button>
    <img id="lbImg" alt="">
    <button class="lb-nav next" id="lbNext" aria-label="Gambar berikutnya">›</button>
  </div>
</div>
<div class="toast" id="toast"></div>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

/* ══════════ 1. ISI TIGA BARIS INI ══════════ */
const SUPABASE_URL = "https://ywhpmgzxxuobxnbnripx.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_KjDOz2PIfaZUX2-3IpGToQ_gunvvGXd";
const ADMIN = "Dhio";           // nama yang tampil pada balasan
/* ══════════════════════════════════════════ */

const BUCKET = "lampiran";
const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const K_SEEN = "klinklin.dibaca." + ADMIN;
const ls = { get:(k,d)=>{ try{ return JSON.parse(localStorage.getItem(k)) ?? d }catch{ return d } }, set:(k,v)=>localStorage.setItem(k, JSON.stringify(v)) };

let daftar = [], room = null, pending = [], seen = new Set(), filter = "semua", cari = "", ch = null;
let dibaca = ls.get(K_SEEN, {});

function toast(m){ const t=$("#toast"); t.textContent=m; t.classList.add("on"); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove("on"),2600); }
const initials = n => String(n||"?").trim().split(/\s+/).slice(0,2).map(w=>w[0]).join("").toUpperCase();
const jam = d => new Date(d).toLocaleTimeString("id-ID",{hour:"2-digit",minute:"2-digit"});
function hari(d){
  const x=new Date(d), t=new Date(), y=new Date(Date.now()-864e5);
  const same=(a,b)=>a.toDateString()===b.toDateString();
  if(same(x,t)) return "Hari ini";
  if(same(x,y)) return "Kemarin";
  return x.toLocaleDateString("id-ID",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
}
function lalu(d){
  const s = (Date.now()-new Date(d))/1000;
  if(s<60) return "baru saja";
  if(s<3600) return Math.floor(s/60)+" mnt";
  if(s<86400) return Math.floor(s/3600)+" jam";
  if(s<604800) return Math.floor(s/86400)+" hr";
  return new Date(d).toLocaleDateString("id-ID",{day:"numeric",month:"short"});
}
const LABEL = { baru:"Baru", diproses:"Diproses", selesai:"Selesai" };
const belumDibaca = r => r.last_sender_role === "pelapor" && new Date(r.last_message_at) > new Date(dibaca[r.id] || 0);

/* ---------- daftar tiket ---------- */
async function muatDaftar(){
  const { data, error } = await sb.from("rooms").select("*").order("last_message_at", { ascending:false }).limit(200);
  if(error){ $("#rooms").innerHTML = `<div class="rail-empty">Gagal memuat daftar: ${esc(error.message)}</div>`; return; }
  daftar = data;
  renderDaftar();
}
function renderDaftar(){
  const q = cari.toLowerCase();
  const f = daftar.filter(r =>
    (filter === "semua" || r.status === filter) &&
    (!q || `${r.nama} ${r.jabatan} ${r.kode} ${r.last_message_preview||""}`.toLowerCase().includes(q))
  );
  $("#cBaru").textContent = daftar.filter(belumDibaca).length || "";
  $("#rooms").innerHTML = f.length ? f.map(r => `
    <button class="room ${room && room.id===r.id ? "on":""}" data-id="${r.id}">
      <div class="l1"><span class="nm">${esc(r.nama)}</span><span class="tm">${lalu(r.last_message_at)}</span></div>
      <div class="jb">${esc(r.jabatan)}</div>
      <div class="pv">${belumDibaca(r)?'<span class="dot"></span>':""}<em>${r.last_sender_role==="admin"?"Kamu:":""}</em>${esc(r.last_message_preview || "Belum ada pesan")}</div>
      <div class="tags"><span class="tag ${r.status}">${LABEL[r.status]}</span><span class="tag">${esc(r.platform)}</span><span class="tag mono">${esc(r.kode)}</span></div>
    </button>`).join("")
    : `<div class="rail-empty">Tidak ada laporan yang cocok.</div>`;
}
$("#rooms").addEventListener("click", e => {
  const b = e.target.closest(".room"); if(!b) return;
  buka(daftar.find(r => r.id === b.dataset.id));
});
$("#q").addEventListener("input", e => { cari = e.target.value; renderDaftar(); });
$("#tabs").addEventListener("click", e => {
  const b = e.target.closest(".tab"); if(!b) return;
  filter = b.dataset.f;
  [...e.currentTarget.children].forEach(c => c.setAttribute("aria-pressed", String(c===b)));
  renderDaftar();
});
$("#back").addEventListener("click", () => { $("#shell").classList.remove("open"); room = null; renderDaftar(); });

/* ---------- buka percakapan ---------- */
async function buka(r){
  if(!r) return;
  room = r;
  $("#blank").style.display = "none";
  $("#chat").style.display = "flex";
  $("#shell").classList.add("open");
  $("#hAva").textContent = initials(r.nama);
  $("#hNama").textContent = r.nama;
  $("#hJab").textContent = `${r.jabatan} · ${r.platform} · dibuat ${new Date(r.created_at).toLocaleDateString("id-ID",{day:"numeric",month:"long",year:"numeric"})}`;
  $("#hKode").textContent = r.kode;
  setStatusUI(r.status);
  dibaca[r.id] = new Date().toISOString(); ls.set(K_SEEN, dibaca);
  renderDaftar();
  await muatPesan();
  langganan();
  $("#input").focus();
}
function setStatusUI(s){ const el=$("#hStatus"); el.value=s; el.className="status "+s; }
$("#hStatus").addEventListener("change", async e => {
  const s = e.target.value;
  setStatusUI(s);
  const { error } = await sb.from("rooms").update({ status:s }).eq("id", room.id);
  if(error){ toast("Status gagal disimpan."); return; }
  room.status = s;
  const i = daftar.findIndex(r => r.id === room.id); if(i>-1) daftar[i].status = s;
  renderDaftar();
  toast("Status jadi " + LABEL[s] + ".");
});

let hariTerakhir = null;
async function muatPesan(){
  hariTerakhir = null; seen.clear();
  $("#logInner").innerHTML = `<div class="ctx">Laporan dari <b>${esc(room.nama)}</b> (${esc(room.jabatan)}) tentang <b>${esc(room.platform)}</b>. Balasan kamu terkirim atas nama <b>${esc(ADMIN)}</b>.</div>`;
  const { data, error } = await sb.from("messages").select("*").eq("room_id", room.id).order("created_at");
  if(error){ toast("Gagal memuat pesan."); return; }
  data.forEach(m => tampil(m, false));
  keBawah(true);
}
function tampil(m, animate = true){
  if(seen.has(m.id)) return;
  seen.add(m.id);
  const wrap = $("#logInner");
  const h = hari(m.created_at);
  if(h !== hariTerakhir){ hariTerakhir = h; wrap.insertAdjacentHTML("beforeend", `<div class="daysep">${esc(h)}</div>`); }
  const mine = m.sender_role === "admin";
  const at = Array.isArray(m.attachments) ? m.attachments : [];
  const gambar = at.length
    ? `<div class="atts ${at.length===1?"one":""}">` + at.map(a =>
        `<button class="att" data-url="${esc(a.url)}" data-name="${esc(a.name||"gambar")}"><img loading="lazy" src="${esc(a.url)}" alt="${esc(a.name||"Lampiran")}"></button>`).join("") + `</div>` : "";
  const teks = m.body?.trim() ? `<p class="text">${esc(m.body)}</p>` : "";
  wrap.insertAdjacentHTML("beforeend", `
    <div class="msg ${mine?"me":""} ${animate?"enter":""}">
      <div class="avatar">${esc(initials(m.sender_name))}</div>
      <div class="msg-main">
        <div class="msg-meta"><b>${esc(m.sender_name)}</b><time>${jam(m.created_at)}</time></div>
        <div class="bubble ${gambar && !teks ? "only-img":""}">${gambar}${teks}</div>
      </div>
    </div>`);
}
function keBawah(instan){ const l=$("#log"); l.scrollTo({ top:l.scrollHeight, behavior: instan ? "auto":"smooth" }); }

/* ---------- realtime ---------- */
function langganan(){
  if(ch) sb.removeChannel(ch);
  ch = sb.channel("adm-" + room.id)
    .on("postgres_changes", { event:"INSERT", schema:"public", table:"messages", filter:`room_id=eq.${room.id}` },
      p => { tampil(p.new); keBawah(); dibaca[room.id]=new Date().toISOString(); ls.set(K_SEEN,dibaca); })
    .subscribe();
}
sb.channel("adm-rooms")
  .on("postgres_changes", { event:"*", schema:"public", table:"rooms" }, () => muatDaftar())
  .subscribe();

setInterval(async () => {
  if(document.hidden) return;
  await muatDaftar();
  if(!room) return;
  const { data } = await sb.from("messages").select("*").eq("room_id", room.id).order("created_at");
  if(!data) return;
  const baru = data.filter(m => !seen.has(m.id));
  if(baru.length){ baru.forEach(m => tampil(m)); keBawah(); dibaca[room.id]=new Date().toISOString(); ls.set(K_SEEN,dibaca); }
}, 10000);

/* ---------- komposer ---------- */
const input = $("#input"), sendBtn = $("#sendBtn");
function sync(){
  input.style.height="auto";
  input.style.height=Math.min(input.scrollHeight,150)+"px";
  sendBtn.disabled = !input.value.trim() && pending.length===0;
}
input.addEventListener("input", sync);
input.addEventListener("keydown", e => { if(e.key==="Enter" && !e.shiftKey){ e.preventDefault(); kirim(); } });
sendBtn.addEventListener("click", kirim);
$("#quick").addEventListener("click", e => {
  const b = e.target.closest("button"); if(!b) return;
  input.value = (input.value ? input.value.trim()+" " : "") + b.textContent;
  input.focus(); sync();
});
$("#clipBtn").addEventListener("click", () => $("#file").click());
$("#file").addEventListener("change", e => { antre([...e.target.files]); e.target.value=""; });
input.addEventListener("paste", e => {
  const f = [...e.clipboardData.files].filter(x => x.type.startsWith("image/"));
  if(f.length){ e.preventDefault(); antre(f); }
});
const box = $("#box");
["dragover","dragenter"].forEach(ev => box.addEventListener(ev, e => { e.preventDefault(); box.classList.add("drop"); }));
["dragleave","drop"].forEach(ev => box.addEventListener(ev, e => { e.preventDefault(); box.classList.remove("drop"); }));
box.addEventListener("drop", e => antre([...e.dataTransfer.files].filter(f => f.type.startsWith("image/"))));

function antre(files){
  files.slice(0,6).forEach(f => {
    if(!f.type.startsWith("image/")) return;
    if(f.size > 12*1024*1024){ toast(`${f.name} lebih dari 12 MB, tidak dilampirkan.`); return; }
    pending.push({ file:f, url:URL.createObjectURL(f), id:Math.random().toString(36).slice(2) });
  });
  renderTray(); sync();
}
function renderTray(){
  $("#tray").innerHTML = pending.map(p => `<div class="thumb" data-id="${p.id}"><img src="${p.url}" alt=""><button class="x" aria-label="Hapus lampiran">×</button><div class="bar"></div></div>`).join("");
}
$("#tray").addEventListener("click", e => {
  const t = e.target.closest(".thumb"); if(!t || !e.target.closest(".x")) return;
  pending = pending.filter(p => p.id !== t.dataset.id);
  renderTray(); sync();
});
async function kecilkan(file){
  if(file.size < 400*1024) return file;
  try{
    const bmp = await createImageBitmap(file);
    const skala = Math.min(1, 1800/Math.max(bmp.width,bmp.height));
    const c = document.createElement("canvas");
    c.width = Math.round(bmp.width*skala); c.height = Math.round(bmp.height*skala);
    c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
    const blob = await new Promise(r => c.toBlob(r,"image/jpeg",.86));
    return blob && blob.size < file.size ? new File([blob], file.name.replace(/\.\w+$/,"")+".jpg", { type:"image/jpeg" }) : file;
  }catch{ return file; }
}
let mengirim = false;
async function kirim(){
  if(mengirim || !room) return;
  const body = input.value.trim();
  if(!body && !pending.length) return;
  mengirim = true; sendBtn.disabled = true;
  try{
    const lampiran = [];
    for(const p of pending){
      const el = document.querySelector(`.thumb[data-id="${p.id}"] .bar`);
      if(el) el.style.width = "45%";
      const f = await kecilkan(p.file);
      const path = `${room.id}/${Date.now()}-${Math.random().toString(36).slice(2,7)}-${f.name.replace(/[^\w.\-]/g,"_")}`;
      const { error } = await sb.storage.from(BUCKET).upload(path, f, { cacheControl:"31536000" });
      if(error) throw error;
      const { data:{ publicUrl } } = sb.storage.from(BUCKET).getPublicUrl(path);
      lampiran.push({ url:publicUrl, name:f.name });
      if(el) el.style.width = "100%";
    }
    const { error } = await sb.from("messages").insert({ room_id:room.id, sender_role:"admin", sender_name:ADMIN, body, attachments:lampiran });
    if(error) throw error;
    if(room.status === "baru"){ await sb.from("rooms").update({ status:"diproses" }).eq("id", room.id); room.status="diproses"; setStatusUI("diproses"); }
    input.value=""; pending.forEach(p=>URL.revokeObjectURL(p.url)); pending=[];
    renderTray(); sync(); keBawah(); muatDaftar();
  }catch(ex){
    toast("Balasan gagal terkirim: " + (ex.message || "periksa koneksi"));
  }finally{ mengirim=false; sync(); }
}

/* ---------- lightbox ---------- */
let galeri = [], idx = 0;
document.addEventListener("click", e => {
  const b = e.target.closest(".att"); if(!b) return;
  galeri = [...document.querySelectorAll(".att")]; idx = galeri.indexOf(b); bukaLb();
});
function bukaLb(){
  const b = galeri[idx];
  $("#lbImg").src = b.dataset.url;
  $("#lbCap").textContent = `${b.dataset.name} · ${idx+1} dari ${galeri.length}`;
  $("#lbDl").href = b.dataset.url;
  $("#lbPrev").style.visibility = $("#lbNext").style.visibility = galeri.length>1 ? "visible":"hidden";
  $("#lb").classList.add("on");
}
const tutupLb = () => { $("#lb").classList.remove("on"); $("#lbImg").src=""; };
$("#lbClose").addEventListener("click", tutupLb);
$("#lb").addEventListener("click", e => { if(e.target.id==="lb" || e.target.classList.contains("lb-stage")) tutupLb(); });
$("#lbPrev").addEventListener("click", () => { idx=(idx-1+galeri.length)%galeri.length; bukaLb(); });
$("#lbNext").addEventListener("click", () => { idx=(idx+1)%galeri.length; bukaLb(); });
document.addEventListener("keydown", e => {
  if(!$("#lb").classList.contains("on")) return;
  if(e.key==="Escape") tutupLb();
  if(e.key==="ArrowLeft") $("#lbPrev").click();
  if(e.key==="ArrowRight") $("#lbNext").click();
});

muatDaftar();
</script>
</body>
</html>
